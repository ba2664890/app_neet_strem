version: '3.9'

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: ianova_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ianova_db}
      POSTGRES_USER: ${POSTGRES_USER:-ianova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ianova_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ianova_user -d ianova_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ianova_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO (Stockage fichiers) ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ianova_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── Django Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ianova_backend
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py loaddata initial_data.json &&
             gunicorn ianova_project.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ianova-super-secret-key-prod-change-me}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ianova_db}
      DB_USER: ${DB_USER:-ianova_user}
      DB_PASSWORD: ${DB_PASSWORD:-ianova_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ianova_project.settings.base}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ianova_celery
    command: celery -A ianova_project worker -l info -Q default,reports,ml
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ianova-super-secret-key-prod-change-me}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ianova_db}
      DB_USER: ${DB_USER:-ianova_user}
      DB_PASSWORD: ${DB_PASSWORD:-ianova_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ianova_project.settings.base}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── Celery Beat (tâches planifiées) ──────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ianova_celery_beat
    command: celery -A ianova_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ianova-super-secret-key-prod-change-me}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ianova_db}
      DB_USER: ${DB_USER:-ianova_user}
      DB_PASSWORD: ${DB_PASSWORD:-ianova_password}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-ianova_project.settings.base}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ianova_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ianova_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  static_volume:
  media_volume:

networks:
  default:
    name: ianova_network
